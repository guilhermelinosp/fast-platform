apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-platform
  labels: &id001
    app.kubernetes.io/name: hellnet-service
    app.kubernetes.io/instance: fast-platform
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: fast-platform
        image: ghcr.io/guilhermelinosp/fast-platform:v1.11.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: fast-platform
        env:
        - name: HELLNET_SERVICE
          value: fast-platform
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: fast-database
              key: DATABASE_USERNAME
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fast-database
              key: DATABASE_PASSWORD
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: '2'
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
