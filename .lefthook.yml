---
output: false

pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.go"
      run: go fmt ./...
    vet:
      glob: "*.go"
      run: go vet ./...
    test:
      glob: "*.go"
      run: go test -count=1 ./...
    race:
      glob: "*.go"
      run: go test -count=1 -race ./...
    build:
      glob: "*.go"
      run: go build ./...
    tidy:
      run: >-
        go mod tidy &&
        git diff --exit-code -- go.mod go.sum
    lint:
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run
        else
          echo "golangci-lint not installed; skipping"
        fi
    yamllint:
      glob: "*.{yaml,yml}"
      run: test -z "{staged_files}" || yamllint {staged_files}
    secrets-scan:
      glob: "*.{yaml,yml,go,json,sh}"
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --source . --no-git -v
        else
          echo "gitleaks not installed; skipping"
        fi

    govulncheck:
      run: |
        if command -v govulncheck >/dev/null 2>&1; then
          govulncheck ./...
        else
          echo "govulncheck not installed; skipping"
        fi
    mod-verify:
      run: go mod verify

pre-push:
  commands:
    tidy:
      run: go mod tidy && git diff --exit-code -- go.mod go.sum
    test:
      run: go test -count=1 -race ./...
    build:
      run: go build ./...

# yamllint disable rule:line-length
commit-msg:
  commands:
    conventional:
      run: |
        grep -Eq "^(feat|fix|docs|style|refactor|perf|test|ci|chore|revert|ops|build)(\(.+\))?!?: .+" {1}
# yamllint enable rule:line-length
